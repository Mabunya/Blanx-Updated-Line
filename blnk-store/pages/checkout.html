<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checkout — BLANX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="stylesheet" href="../assets/css/pages.css" />
</head>
<body>
<main class="checkout-page">
  <h1>Checkout</h1>
  <div class="checkout-layout">
    <form class="checkout-form" id="checkoutForm" onsubmit="submitCheckout(event)">
      <h2>CONTACT DETAILS</h2>
      <div class="form-row">
        <div class="form-group"><label for="firstName">FIRST NAME *</label><input type="text" id="firstName" required /></div>
        <div class="form-group"><label for="lastName">LAST NAME *</label><input type="text" id="lastName" required /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="phone">PHONE NUMBER *</label><input type="tel" id="phone" placeholder="07XX XXX XXX" required /></div>
        <div class="form-group"><label for="email">EMAIL (OPTIONAL)</label><input type="email" id="email" /></div>
      </div>

      <h2 class="gap">DELIVERY</h2>
      <div class="form-group"><label for="location">DELIVERY LOCATION *</label><input type="text" id="location" placeholder="e.g. Westlands, Nairobi" required /></div>
      <div class="form-group"><label for="notes">DELIVERY NOTES (OPTIONAL)</label><textarea id="notes" placeholder="Apartment, floor, nearby landmark, preferred time..."></textarea></div>

      <h2 class="gap">PAYMENT METHOD</h2>
      <div class="payment-options">
        <label class="payment-option selected" onclick="selectPayment(this)">
          <input type="radio" name="payment" value="M-Pesa" checked />
          <div><span class="po-title">M-Pesa</span><small>Pay via STK push — you'll receive a prompt on your phone</small></div>
        </label>
        <label class="payment-option" onclick="selectPayment(this)">
          <input type="radio" name="payment" value="Cash on Delivery" />
          <div><span class="po-title">Cash on Delivery</span><small>Pay the courier when your order arrives</small></div>
        </label>
        <label class="payment-option" onclick="selectPayment(this)">
          <input type="radio" name="payment" value="Card" />
          <div><span class="po-title">Card</span><small>We'll send you a secure payment link via WhatsApp</small></div>
        </label>
      </div>

      <button type="submit" class="btn-checkout gap-top">PLACE ORDER</button>
      <p class="cart-note">M-Pesa sends a prompt to your phone. Other methods confirm on WhatsApp. No card details are taken on this site.</p>
      <div id="paymentStatus" class="payment-status" style="display:none;" role="status" aria-live="polite"></div>
    </form>

    <aside class="checkout-summary">
      <h3>ORDER SUMMARY</h3>
      <div id="checkoutItems"></div>
      <div class="cart-summary-row top-gap"><span>Subtotal</span><span id="checkoutSubtotal">KES 0</span></div>
      <div class="cart-summary-row"><span>Delivery</span><span>TBD on WhatsApp</span></div>
      <div class="cart-summary-row total"><span>Total</span><span id="checkoutTotal">KES 0</span></div>
    </aside>
  </div>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/data/products.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data/store.js"></script>
<script src="../assets/js/cart.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/checkout.js"></script>
</body>
</html>
