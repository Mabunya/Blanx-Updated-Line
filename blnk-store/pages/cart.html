<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cart — BLANX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="stylesheet" href="../assets/css/pages.css" />
</head>
<body>
<main class="cart-page">
  <h1>Your Cart</h1>
  <div class="cart-layout" id="cartLayout">
    <div class="cart-page-items" id="cartPageItems"></div>
    <aside class="cart-summary">
      <h3>ORDER SUMMARY</h3>
      <div class="cart-summary-row"><span>Subtotal</span><span id="summarySubtotal">KES 0</span></div>
      <div class="cart-summary-row"><span>Delivery</span><span>Calculated at checkout</span></div>
      <div class="cart-summary-row total"><span>Total</span><span id="summaryTotal">KES 0</span></div>
      <a href="checkout.html" class="btn-checkout">PROCEED TO CHECKOUT</a>
      <button class="btn-checkout wa" onclick="checkoutWhatsApp()">QUICK ORDER ON WHATSAPP</button>
      <a href="../index.html#shop" class="link-quiet">CONTINUE SHOPPING</a>
    </aside>
  </div>
  <div class="cart-empty-page" id="cartEmptyPage" style="display:none;">
    <h2>Your cart is empty</h2>
    <p>Add something you like and come back.</p>
    <a href="../index.html#shop" class="btn-outline dark">SHOP NOW</a>
  </div>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/data/products.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/data/store.js"></script>
<script src="../assets/js/cart.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/cart-page.js"></script>
</body>
</html>
